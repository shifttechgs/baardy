services:
  - type: web
    name: baardy
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Baardy
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://baardy.onrender.com
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: baardy-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: baardy
      - key: DB_USERNAME
        value: baardy
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: baardy-mysql
          envVarKey: MYSQL_PASSWORD

  - type: pserv
    name: baardy-mysql
    runtime: docker
    dockerfilePath: ./docker/mysql/Dockerfile
    dockerContext: ./docker/mysql
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_DATABASE
        value: baardy
      - key: MYSQL_USER
        value: baardy
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
